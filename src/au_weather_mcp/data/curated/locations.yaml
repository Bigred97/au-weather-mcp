# Curated Australian locations for au-weather-mcp.
#
# 21 locations covering the 8 capitals + 13 major regional centres.
# Coordinates picked to align with the canonical BOM observation point for
# each city where possible (e.g. Sydney = Observatory Hill, Melbourne =
# Olympic Park). Timezones use IANA names so Open-Meteo applies the right
# local-time offset including DST.
#
# Adding a location: pick its (lat, lng) from the BOM weather-station list
# if possible; otherwise centre-of-city. Use the IANA timezone for the
# location's state. The `nearest_bom_station` field is informational only —
# Open-Meteo doesn't use it, but it lets users cross-check our values against
# the official BOM observation if they want.

locations:
  # ---------- Capitals ----------
  sydney:
    name: Sydney
    state: NSW
    description: New South Wales capital. Observatory Hill is the canonical observation point.
    latitude: -33.8607
    longitude: 151.2050
    timezone: Australia/Sydney
    elevation_m: 39
    nearest_bom_station: 066062 (Sydney Observatory Hill)

